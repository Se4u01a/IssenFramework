; Issen Framework. Log: Documents\My Games\Skyrim Special Edition\SKSE\IssenFramework.log
; What an issen does to each kind of enemy: SKSE\Plugins\IssenFramework\Rules\*.json.

[Window]
; Issen: the attack button was pressed at most this many seconds before the enemy's hit on you landed.
fWindow=0.12
; Issen after a perfect dodge (Reactive Dodge Framework): an attack press this many seconds after the perfect dodge.
fPerfectDodgeWindow=0.40
; Calibration log: presses up to fEarlyLog before a hit are reported as "early", up to fLateLog after it as "late".
fEarlyLog=0.50
fLateLog=0.30
; Two hit reports from the same attacker this close together are one swing (Precision and the game both report it).
fSameSwing=0.25
; A press this soon after the previous one makes no issen (mashing the attack button).
fMashGuard=0.30

[Perks]
; The issen has to be learned: without this perk of the player there is none. Plugin.esp|0xFormID (FormID inside that
; plugin) or an EditorID (only with a mod that keeps perk EditorIDs, e.g. po3's Tweaks). Empty = always available.
; Finer control (one-shot thresholds, dismemberment, damage by perk) lives in the rules: when.playerPerksAny/All/None.
sRequirePerk=
sRequirePerkPerfect=

[Damage]
; One damage model for every enemy instead of the numbers in the rules (Rules\*.json); the rules still decide who is
; immune, what is cut off and the stagger. Shares are of the enemy's maximum health.
; Damage = fMaxHealthPct x max health + fWeaponMult x your weapon's base damage + fFlat. The enemy dies outright while its
; health is at most fOneShotBelowPct of its maximum (1 = always, 0 = never), or when the damage leaves it at most
; fExecuteBelowPct. Bosses (on a Boss location marker): damage x fBossDamageMult and their own thresholds.
bGlobal=0
fMaxHealthPct=0.35
fWeaponMult=0
fFlat=0
fOneShotBelowPct=0.5
fExecuteBelowPct=0.3
fBossDamageMult=1.0
fBossOneShotBelowPct=0.25
fBossExecuteBelowPct=0.25

[Cost]
; Stamina an issen takes, only when it fires: fStamina for the normal one, fStaminaPerfect after a perfect dodge, plus
; fStaminaMaxPct of your maximum stamina (0.1 = 10%). bRequireStamina: without enough there is no issen; off = it fires
; anyway and empties the bar. All 0 = free.
fStamina=20
fStaminaPerfect=10
fStaminaMaxPct=0.0
bRequireStamina=1

[Input]
; The left attack button counts while the left hand holds a melee weapon (dual wielding).
bLeftHand=1
; Attacks with fists count.
bUnarmed=0
; More attack buttons, comma-separated codes (keyboard: DirectInput scan codes; mouse: 0 left, 1 right, 2 middle...;
; gamepad: Skyrim's button codes). For example a separate power attack key of BFCO / MCO.
sExtraKeyboard=
sExtraMouse=
sExtraGamepad=

[Conditions]
; Issen: the attacker within fMaxDistance units and fMaxAngle degrees of where you face.
fMaxDistance=300
fMaxAngle=75
; Issen after a perfect dodge: the dodge carries you away and the attacker is usually beside or behind you.
fPerfectMaxDistance=450
bPerfectIgnoreAngle=1

[Execute]
; 0: detect and log only, nothing happens in the game.
bEnabled=1
; Seconds from the issen to the kill / damage when no strike animation plays ([Animation]).
fStrikeDelay=0.10
; Turn you to the enemy.
bFaceTarget=1
; Issen after a perfect dodge: you are put fDashStopDistance units in front of the enemy first.
bDashOnPerfectDodge=1
fDashStopDistance=90
; Dismembering Framework on kills, when it is installed and the rule asks for it.
bDismember=1

[Animation]
; Your issen strike, one picked at random each time: "graphEvent pitchDegrees rollDegrees" (the angles turn the strike
; effects to match that swing: side power attacks cut flat and always decapitate; the standing power attack cuts
; overhead and plays any dismemberment from the enemy's pool). Sent after attackStop so it is taken mid-attack.
; Empty = keep the attack you pressed.
sEvent=attackPowerStartRight 0 0, attackPowerStartLeft 0 0, attackPowerStartInPlace -90 0
bStopFirst=1
; Played this many times faster (a temporary WeaponSpeedMult on you, taken off after fSpeedTime seconds and before
; every save).
fSpeed=2.0
; The same when the strike follows a dash (after a back step or a perfect dodge).
fSpeedAfterDash=1.3
fSpeedTime=0.6
; The kill / damage lands on the clip's HitFrame, or after fStrikeMaxDelay if none comes (else after fStrikeDelay).
bStrikeOnHitFrame=1
fStrikeMaxDelay=0.9
; The strike clip does not move you (a side power attack carries you sideways); held this long past the strike too.
bLockPosition=1
fLockAfter=0.35

[Approach]
; Normal issen: a back step first (a Reactive Dodge Framework dodge at fPreStepAngle, 180 = straight back), then you
; vanish and appear in front of the enemy, striking. Off = strike from where you stand.
bPreStep=1
fPreStepAngle=180
fPreStepTime=0.25
; Seconds the dash to the enemy takes (after the back step, or right away for a perfect-dodge issen with
; [Execute] bDashOnPerfectDodge=1); [Ghost] silhouettes are left along it.
fVanishTime=0.12
; Seconds standing in front of the enemy after the dash, before the strike starts.
fAppearPause=0.15
; Shown on you as the dash starts / ends: Plugin|0xFormID, empty = none (the ghosts are the default look).
; Alduin's time teleport: sVanishShader=Skyrim.esm|0x0EC355  sAppearShader=Skyrim.esm|0x0EC354  sVanishArt=Skyrim.esm|0x0EC353
; Vampire bats:           sVanishShader=Dawnguard.esm|0x018EF0  sAppearShader=Dawnguard.esm|0x018EF1  sVanishArt=Dawnguard.esm|0x018EEF
sVanishShader=
sAppearShader=
sVanishArt=
sAppearArt=
fFxTime=0.6

[Ghost]
; Glowing silhouettes of you left along the dash (the GhostTrails mod; without it there are none).
bEnabled=1
iCount=6
; Game seconds between silhouettes, and how long each one fades.
fInterval=0.02
fLifetime=0.45
; r, g, b, alpha (0..1), glow intensity, rim power.
sColor=0.55, 0.8, 1.0, 0.6
fIntensity=2.5
fRimPower=2.0

[Death]
; Onimusha's delayed death: struck, the enemy stands for fDelay seconds (its hits no longer land), then it dies and
; Dismembering Framework cuts it. Off = it dies on the strike. bSheathe: once the combat an issen kill was part of is
; over, the weapon is put away after fSheatheDelay seconds out of combat.
bDelayed=1
fDelay=0.9
bSheathe=1
fSheatheDelay=0.5
; Extra sound on the sheathe (the sheathe clip has its own), e.g. Skyrim.esm|0x03C72F WPNBlade1HandSheatheSD.
sSheatheSound=
; Seconds the death is waited for before a second try (the engine can take a few frames to show it).
fKillVerifyTime=0.5

[Camera]
; The whole scene, you included, freezes this many real seconds on the strike (0 = off), at this speed.
fHitstop=0.08
fHitstopScale=0.03
; Third-person field of view narrows by this many degrees during the issen (0 = off); in / out in real seconds.
fZoomFov=8
fZoomIn=0.10
fZoomOut=0.45

[SlowMotion]
; World and your own speed (1 = normal); times in real seconds. The world stays slowed through the whole strike (from
; the issen until the kill / damage lands), then for fHold more, then eases out over fEaseOut.
fWorld=0.15
fPlayer=1.0
fEaseIn=0.0
fHold=0.35
fEaseOut=0.30
; Colour left during the slow motion: 0 = black and white, 1 = full colour. It comes back as the slow motion eases out.
fSaturation=0.0

[Cue]
; Telegraph flash / glint on the enemy when an issen window opens (both right before the enemy's swing lands and right
; after a perfect dodge). bOnWeapon places the flash on the enemy's weapon / shield / hand, falling back to sNode on
; unarmed creatures.
bEnabled=1
bOnSwing=1
bOnPerfectDodge=1
bOnWeapon=1
sNode=NPC Spine2 [Spn2]
sVfx=effects\impacteffects\AP05\ssex_Glow.nif 1.2 0 0, effects\impacteffects\AP05\ssex_Sparks.nif 0.7 0 0
fVfxLifetime=0.35
sShader=
fShaderDuration=0.35
sArt=
fArtDuration=0.35
sSound=

[Effects]
; Plugin|0xFormID (FormID inside that plugin); empty = off. Lists are comma-separated.
; Flash: alduinExplosionFlashImod (0.25 s). Slow motion sound: VOCShoutFXSlowTimeIn.
sFlashImod=Skyrim.esm|0x07E8FD
fFlashStrength=1.0
sSlowSound=Skyrim.esm|0x0ADE24
; Strike sound, the first one found: separated Slash Effects X's slash, else the vanilla NPCKillSlash.
sStrikeSound=separated Slash Effects X.esp|0x000802, Skyrim.esm|0x0DAB81
; Impact data sets played on the enemy at the strike: separated Slash Effects X's special slash and sparks slash.
; (off: nothing showed in game) separated Slash Effects X.esp|0x000800, separated Slash Effects X.esp|0x000808
sStrikeImpacts=
sStrikeImpactNode=NPC Spine2 [Spn2]
; .nif effects (under meshes\) attached to the enemy as art objects, for fStrikeArtDuration seconds (off by default).
sStrikeArt=
fStrikeArtDuration=1.0
; .nif effects spawned in the world at the enemy's sStrikeImpactNode on the strike, turned to your swing:
; "path scale rollDegrees pitchDegrees": roll turns the effect about your swing's direction, pitch about its side axis
; (pitch 90 lays a slash that faces you flat). Default: separated Slash Effects X's side slash and special slash
; (flat, long), sparks, impact, ring, glow.
sStrikeVfx=effects\impacteffects\AP05\ssex_StandardSlash.nif 2.6 0 90, effects\impacteffects\AP05\ssex_specialslash.nif 1.8 0 90, effects\impacteffects\AP05\ssex_SparksSlash.nif 1.0 0, effects\impacteffects\AP05\ssex_SlashImpact.nif 1.0 0, effects\impacteffects\AP05\ssex_Sparks.nif 1.0 0, effects\impacteffects\AP05\ssex_RingOfFire.nif 1.0 0, effects\impacteffects\AP05\ssex_Glow.nif 1.0 0
fStrikeVfxLifetime=1.5

[Compat]
; Use Precision's pre-hit callback (its hit moment is the collision itself).
bUsePrecision=1
; Issen after a perfect dodge, from Reactive Dodge Framework's mod event ([Perfect] sModEvent in its ini).
bPerfectDodge=1
sRdfPerfectDodgeEvent=RDF_PerfectDodge
; The strike is a real weapon hit of the game (its damage set by the issen, never blocked): perks, enchantment, poison,
; the hit event (Papyrus OnHit) and the hit reaction, as with any hit. The difficulty can not lower the issen's damage.
bRealHit=1
; With bRealHit=0 the issen deals its damage directly, which raises no hit event: send one, so Papyrus OnHit and other mods' on-hit
; mechanics see the strike as a hit by your weapon. bHitPowerAttack flags it as a power attack (abPowerAttack).
bSendHitEvent=1
bHitPowerAttack=1
; Cast what a real weapon hit would: the perks' "Apply Combat Hit Spell" (the axes' bleeding and the like) and the
; weapon's enchantment (its charge is not drained).
bHitSpells=1

[Dev]
; Every press, hit and verdict in the log (ISSEN lines are always written).
bDevLog=1
